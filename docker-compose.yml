services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rumbl
      POSTGRES_USER: rumbl
      POSTGRES_PASSWORD: rumbl
    volumes:
      - rumbl_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rumbl -d rumbl"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rumbl_pg:
